[project]
name = "gonzo-pit-strategy"
version = "0.1.0"
description = "F1 Pit Strategy Prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hvac>=2.4.0",
    "keras>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.0.0",
    "sqlalchemy>=2.0.0",
    # Used unconditionally by the TensorBoard callback in training/runner.py.
    # Not a declared dependency of tensorflow, so it must be requested here.
    "tensorboard>=2.15.0",
    "tensorflow>=2.15.0",
]

[project.optional-dependencies]
# dbt owns the raw-tables -> prep_training_dataset transformation. Only needed
# to rebuild the dataset, not to train against an existing one.
dbt = [
    "dbt-core>=1.8.0",
    "dbt-postgres>=1.8.0",
]
notebooks = [
    "notebook>=7.0.0",
]

[project.scripts]
gonzo-train = "gonzo_pit_strategy.cli.train:main"
gonzo-load = "gonzo_pit_strategy.cli.load:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gonzo_pit_strategy"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
